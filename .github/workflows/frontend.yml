name: frontend

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run yarn install, check and build
        run: |
          npm install --global corepack
          corepack enable
          yarn install --immutable
          yarn run check
          yarn run build
        working-directory: html
