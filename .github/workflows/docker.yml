name: docker

on:
  push:
    branches: main
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    env:
      DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl file libtool
      - name: Cross build multi-arch binary
        run: |
          mkdir dist
          for arch in amd64 armv7 arm64 s390x; do
            env BUILD_TARGET=$arch ./scripts/cross-build.sh
            [ "$arch" = "armv7" ] && arch="arm" 
            mkdir -p dist/$arch && cp build/ttyd dist/$arch/ttyd
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.DOCKER_HUB_USER != ''
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine docker tags
        id: docker_tag
        run: |
          IMAGE="${GITHUB_REPOSITORY,,}"
          case $GITHUB_REF in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}"; ALPINE_TAG="${TAG}-alpine" ;;
            *) TAG=latest; ALPINE_TAG=alpine ;;
          esac
          {
            echo "tags<<EOF"
            echo "ghcr.io/${IMAGE}:${TAG}"
            if [ -n "$DOCKER_HUB_USER" ]; then echo "${DOCKER_HUB_USER}/ttyd:${TAG}"; fi
            echo EOF
            echo "alpine_tags<<EOF"
            echo "ghcr.io/${IMAGE}:${ALPINE_TAG}"
            if [ -n "$DOCKER_HUB_USER" ]; then echo "${DOCKER_HUB_USER}/ttyd:${ALPINE_TAG}"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: build/push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/s390x
          push: true
          tags: ${{ steps.docker_tag.outputs.tags }}
      - name: build/push docker image (alpine)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/s390x
          push: true
          tags: ${{ steps.docker_tag.outputs.alpine_tags }}
