name: docker

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl file libtool
      - name: Cross build multi-arch binary
        run: |
          mkdir dist
          for arch in amd64 armv7 arm64 s390x; do
            env BUILD_TARGET="$arch" ./scripts/cross-build.sh
            image_arch="$arch"
            [ "$arch" = "armv7" ] && image_arch="arm"
            mkdir -p "dist/$image_arch"
            cp "build/cross/$arch/ttyd" "dist/$image_arch/ttyd"
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine docker tags
        id: docker_tag
        run: |
          IMAGE="${GITHUB_REPOSITORY_OWNER,,}/ttyd-ng"
          {
            echo "tags=ghcr.io/${IMAGE}:${GITHUB_REF_NAME}"
            echo "alpine_tags=ghcr.io/${IMAGE}:${GITHUB_REF_NAME}-alpine"
          } >> "$GITHUB_OUTPUT"
      - name: build/push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/s390x
          push: true
          tags: ${{ steps.docker_tag.outputs.tags }}
      - name: build/push docker image (alpine)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/s390x
          push: true
          tags: ${{ steps.docker_tag.outputs.alpine_tags }}
