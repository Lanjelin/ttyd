name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check tag version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/^project(ttyd VERSION \([^ ]*\) .*/\1/p' CMakeLists.txt)
          if [ -z "$VERSION" ] || [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMake version $VERSION"
            exit 1
          fi
  frontend:
    needs: [validate]
    uses: ./.github/workflows/frontend.yml
  build:
    needs: [frontend]
    uses: ./.github/workflows/backend.yml
  docker:
    needs: [frontend]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
  publish:
    needs: [build, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
        
      - run: |
          mkdir release-assets
          for file in artifacts/ttyd.*/*; do
            target="${file%/*}"
            target="${target##*/}"
            [[ $file == *.exe ]] && target="$target.exe"
            mv "$file" "release-assets/$target"
          done
          (cd release-assets && sha256sum ttyd.* > SHA256SUMS)
      - uses: ncipollo/release-action@v1
        with:
          artifacts: release-assets/*
          allowUpdates: false
          draft: true
